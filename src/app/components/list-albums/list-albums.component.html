
<div class="input mt-3" >
  <input type="text" [(ngModel)]="letter">

  <button (click)="searchAlbums()">SEARCH</button>
</div>
<div class="card text-left my-4" *ngFor="let album of albums; let i=index">
  <div class="card-header">
    <ul class="nav nav-tabs card-header-tabs">
      <li class="nav-item">
        <p>{{album.ref}}</p>
      </li>
    </ul>
  </div>
  <div class="card-body">
   <a [routerLink]="['/album', album.id]"> <span class="title">{{album.title}}</span></a>
    <p class="card-text">
    <p>{{album.description}}</p>
    <p>
      <span class="mx-2" *ngFor="let tag of album.tags let i=index"><button>{{tag}}</button></span>
    </p>
    <p class="text-center flex-lg-row">
      <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#5f6368">
        <path
          d="m480-120-58-52q-101-91-167-157T150-447.5Q111-500 95.5-544T80-634q0-94 63-157t157-63q52 0 99 22t81 62q34-40 81-62t99-22q94 0 157 63t63 157q0 46-15.5 90T810-447.5Q771-395 705-329T538-172l-58 52Zm0-108q96-86 158-147.5t98-107q36-45.5 50-81t14-70.5q0-60-40-100t-100-40q-47 0-87 26.5T518-680h-76q-15-41-55-67.5T300-774q-60 0-100 40t-40 100q0 35 14 70.5t50 81q36 45.5 98 107T480-228Zm0-273Z" />
      </svg>
      <button class="btn btn-secondary">fr</button>
      <span>5</span>
      <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#5f6368">
        <path
          d="M360-840v-80h240v80H360Zm80 440h80v-240h-80v240Zm40 320q-74 0-139.5-28.5T226-186q-49-49-77.5-114.5T120-440q0-74 28.5-139.5T226-694q49-49 114.5-77.5T480-800q62 0 119 20t107 58l56-56 56 56-56 56q38 50 58 107t20 119q0 74-28.5 139.5T734-186q-49 49-114.5 77.5T480-80Zm0-80q116 0 198-82t82-198q0-116-82-198t-198-82q-116 0-198 82t-82 198q0 116 82 198t198 82Zm0-280Z" />
      </svg>
      <button class="btn btn-secondary">{{album.duration}}</button>

      <a (click)="afficherList((album.id))" class="btn btn-secondary"> Détails</a>

    </p>

  </div>


</div>
